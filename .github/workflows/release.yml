name: Release

# 打 tag 即发版：构建签名 release APK，创建 GitHub Release 并把 APK 作为 asset 上传。
#
# Release 是版本信息的唯一来源：应用内更新读 /releases/latest，官网的下载页与更新日志
# 也直接读它。APK 只以 Release asset 分发，不进仓库、也不放 GitHub Pages。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   KEYSTORE_BASE64  密钥库文件的 base64（`base64 -w0 water_keystore.jks`）
#   STORE_PASSWORD   库口令
#   KEY_ALIAS        别名（key0）
#   KEY_PASSWORD     密钥口令
# 注意：口令里若有 `=` 或 `\`，写进 keystore.properties 需要转义，建议先换成简单字符。
#
# 用法（先在 Settings → Secrets 配好签名信息）：
#   打 tag 即发版：git push origin v<版本号>（tag 指向 versionName 一致的提交）
#   手动触发保留：Actions → Release → Run workflow 填 tag，用于失败重跑（会覆盖已有 asset）
#
# 只对正式版本 tag（v1.2.3 形态）触发；v1.3.0-beta.1 这类预发布 tag 不会走这里。

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 先校验版本号一致性，避免白跑几分钟构建
      - name: 校验 tag 与 versionName 一致
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/sync_version.py --expect-tag "$TAG"

      # README 已说明：Gradle 8.11.1 只支持到 Java 23，固定用 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（compileSdk 36）
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 还原签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，请在仓库 Settings → Secrets 里配置签名信息"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: 构建 release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物：$APK"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: 校验版本号一致性
        run: python3 scripts/sync_version.py --check

      # 应用内更新会拿这个摘要校验下载到的安装包，先记下本地产物自己的值
      - name: 计算 APK 的 SHA-256
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "本地构建产物 SHA-256：$SUM"
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖 asset"
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # 应用内更新按这个摘要判断安装包是否完整，所以这里必须核对上传后的值
      - name: 核对 Release asset 的 SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          LOCAL_SUM: ${{ steps.apk.outputs.sum }}
        run: |
          REMOTE_SUM=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | python3 -c 'import json,sys; assets = json.load(sys.stdin).get("assets") or []; apk = [a for a in assets if a["name"].lower().endswith(".apk")]; print((apk[0].get("digest") or "").removeprefix("sha256:") if apk else "")')
          echo "Release asset 的 SHA-256：$REMOTE_SUM"
          if [ -z "$REMOTE_SUM" ]; then
            echo "::error::取不到 Release asset 的摘要，GitHub 可能还没算完"
            exit 1
          fi
          if [ "$REMOTE_SUM" != "$LOCAL_SUM" ]; then
            echo "::error::Release asset 的 SHA-256 与本地构建产物不一致，应用内更新会因此拒绝安装"
            exit 1
          fi
          echo "摘要一致。"
