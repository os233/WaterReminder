name: Release

# 打 tag 即发版：构建签名 release APK，创建 GitHub Release 并把 APK 作为 asset 上传，
# 正式 tag 还会把版本信息写回 docs/version.json 并推 master（预发布 tag 不写，见下）。
#
# 分发链路（谁是权威、谁读谁）：
#   GitHub Release     发布平台 —— APK asset、tag、Release Notes（给人看）
#   docs/version.json  发布 Manifest —— App 内更新与官网都读它，机器字段由本工作流写回
#   GitHub Pages       托管 version.json 与官网静态文件
# APK 只以 Release asset 分发，不进仓库、也不放 GitHub Pages。
#
# ⚠️ 顺序：写回 version.json 必须发生在 asset 上传**之后**。反过来的话 Manifest 会指向
#    一个还不存在的下载地址，老客户端点更新直接 404。这也是机器字段只能由 CI 写、
#    不能本地提前改的原因。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   KEYSTORE_BASE64  密钥库文件的 base64（`base64 -w0 water_keystore.jks`）
#   STORE_PASSWORD   库口令
#   KEY_ALIAS        别名（key0）
#   KEY_PASSWORD     密钥口令
# 注意：口令里若有 `=` 或 `\`，写进 keystore.properties 需要转义，建议先换成简单字符。
#
# 用法（先在 Settings → Secrets 配好签名信息）：
#   打 tag 即发版：git push origin v<版本号>（tag 指向 versionName 一致的提交）
#   预发布同理：  git push origin v<版本号>-<后缀>（如 v0.0.1-beta.1）
#   手动触发保留：Actions → Release → Run workflow 填 tag，用于失败重跑（会覆盖已有 asset）
#
# 触发范围：正式 tag（如 `v0.0.2`）与预发布 tag（如 `v0.0.1-beta.1`）都会发版。
# 两者的差别只有两处 —— Release 的 prerelease 标记，以及是否写回 docs/version.json：
#
#   正式 tag   → 建普通 Release → 写回 Manifest → 所有客户端收到这一版
#   预发布 tag → 建 prerelease  → **不动 Manifest** → 只有主动下载的人拿得到
#
# ⚠️ 预发布绝不能写回 Manifest：Manifest 是所有客户端（含已发布的正式版）唯一的更新源，
#    写进去等于把 beta 推给全部用户。官网首页 / 下载页读 /releases/latest，该端点天然排除
#    prerelease，所以 beta 不会出现在下载页；更新日志页读 /releases 列表，会带「预发布」标签。
#
# ⚠️ glob 语义：`[0-9]*` 是「一个数字 + 任意串」—— `*` 是通配符，不是量词。所以第一条其实
#    **已经**会匹配 `v0.0.1-beta.1`（末尾的 `*` 吃掉了 `-beta.1`）。第二条只是把这个意图
#    显式写出来，免得将来被当成冗余删掉。原来那条 `!v*-*` 排除项已删除 —— 它正是以前
#    「推 beta tag 什么都不发生」的原因。

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # 必须显式取 tag 对象。checkout 默认只按 SHA 取那一个提交（fetch-depth 1、
          # fetch-tags false），容器里就**没有 annotated tag 对象** ——
          # 「判定发布通道」里用 `git cat-file -t "$TAG"` 判断是 annotated 还是 lightweight
          # 会一律判成后者，预发布的 Release 说明因此拿不到，静默退化成兜底文案。
          # （2026-09-17 实测：force push 重跑一次，asset 换了、说明还是旧的。）
          fetch-tags: true

      # 先校验版本号一致性，避免白跑几分钟构建
      - name: 校验 tag 与 versionName 一致
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/sync_version.py --expect-tag "$TAG"

      # 预发布判定：tag 带 `-` 后缀（`v0.0.1-beta.1`）即为预发布。
      # 下游用它决定 Release 是否标 prerelease、以及是否跳过 Manifest 写回。
      - name: 判定发布通道
        id: channel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            *-*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "预发布通道：$TAG"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "正式通道：$TAG"
              ;;
          esac

          # 预发布与正式版的 Release 说明来自不同地方：
          #   正式版 → docs/version.json 的 changelog（唯一手写的正式说明，也是 App 弹窗读的）
          #   预发布 → tag 的注释。因为预发布**不得**写回 Manifest（那是所有客户端的更新源，
          #            写进去等于把 beta 推给全部用户），所以它在 Manifest 里没有自己的说明，
          #            照抄只会抄到上一版正式版的文字。把正文放进 tag 对象里，不碰任何已发布
          #            客户端读的文件，也就不违反 Manifest 的兼容契约。
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            # annotated tag：正文是注释去掉首行标题后的部分
            git tag -l --format='%(contents:body)' "$TAG" | sed '/^$/d' > "$RUNNER_TEMP/tag-notes.txt"
          else
            # lightweight tag 没有注释对象，也没法事后补 —— 只能空着走兜底文案
            : > "$RUNNER_TEMP/tag-notes.txt"
          fi
          echo "notesFile=$RUNNER_TEMP/tag-notes.txt" >> "$GITHUB_OUTPUT"
          # 正文内容用 ::notice:: 打到 Annotation —— 没有 token 也能从 run 网页读到，
          # 是排查「说明为什么没生效」唯一可用的可观测点（logs 端点需要认证）。
          echo "::notice::channel: prerelease=$([ -n "$PRERELEASE" ] && echo "$PRERELEASE" || echo '(case 分支写入)') tagType=$(git cat-file -t "$TAG" 2>&1) notesBytes=$(wc -c < "$RUNNER_TEMP/tag-notes.txt")"
          if [ -s "$RUNNER_TEMP/tag-notes.txt" ]; then
            echo "tag 注释：$(wc -c < "$RUNNER_TEMP/tag-notes.txt") 字节"
          else
            echo "tag 注释为空（lightweight tag 或未写 message）"
          fi

      # README 已说明：Gradle 8.11.1 只支持到 Java 23，固定用 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（compileSdk 36）
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 还原签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，请在仓库 Settings → Secrets 里配置签名信息"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: 构建 release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物：$APK"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: 校验版本号一致性
        run: python3 scripts/sync_version.py --check

      # 应用内更新会拿这个摘要校验下载到的安装包，先记下本地产物自己的值
      - name: 计算 APK 的 SHA-256
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "本地构建产物 SHA-256：$SUM"
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          TAG_NOTES_FILE: ${{ steps.channel.outputs.notesFile }}
        run: |
          # 刻意不用 `[ ... ] && FLAG=--prerelease`：run 是 `bash -e`，条件为假时
          # 整行返回 1，会让脚本在这里直接退出。
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Release 说明：正式版取 docs/version.json 的 changelog（唯一手写的正式说明，
          # 官网更新日志页读的就是这个 body）；预发布取 tag 注释，见「判定发布通道」。
          # 用 --generate-notes 的话页面上只剩「Full Changelog: <链接>」，对用户没有信息量。
          if [ "$PRERELEASE" = "true" ]; then
            NOTES_FILE="$TAG_NOTES_FILE"
          else
            NOTES_FILE="$RUNNER_TEMP/manifest-changelog.txt"
            python3 -c "import json;print(json.load(open('docs/version.json',encoding='utf-8')).get('changelog') or '')" > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::更新说明为空（预发布看 tag 注释，正式版看 docs/version.json 的 changelog）"
            printf '%s\n' "（本次发版没有填写更新说明）" > "$NOTES_FILE"
          fi
          echo "::notice::release-body: prerelease='$PRERELEASE' tagNotesFile='$TAG_NOTES_FILE' notesFile='$NOTES_FILE' bytes=$(wc -c < "$NOTES_FILE") firstLine=$(head -1 "$NOTES_FILE")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖 asset 与说明"
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
            # 重跑时补标记：手建过的 Release 可能没标 prerelease —— 那样它就成了
            # /releases/latest 的候选，会把 beta 顶到官网下载页上。
            if [ -n "$PRERELEASE_FLAG" ]; then
              gh release edit "$TAG" --prerelease
            fi
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --title "$TAG" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          fi

          # 立刻回读确认，并把结果打进 Annotation。这一步不是装饰：
          # 2026-09-17 实测过「gh release create 返回 0、下一步按 tag 查 Release 却 404」，
          # 而失败信息长成「取不到 asset 摘要」，指向完全错误的方向（让人去查 digest 计算延迟，
          # 实际是 Release 没建出来）。这里当场判定，失败信息直接给 HTTP 状态。
          CODE=$(curl -sSL -o "$RUNNER_TEMP/rel.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          echo "回读 Release：HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::创建/更新 Release 后回读失败（HTTP $CODE，tag=$TAG）。响应：$(head -c 300 "$RUNNER_TEMP/rel.json")"
            exit 1
          fi
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print("Release:", d["tag_name"], "prerelease=", d["prerelease"]); print("assets:", [a["name"] for a in d.get("assets") or []])' "$RUNNER_TEMP/rel.json"

      # 应用内更新按这个摘要判断安装包是否完整，所以这里必须核对上传后的值
      - name: 核对 Release asset 的 SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          LOCAL_SUM: ${{ steps.apk.outputs.sum }}
        run: |
          # asset 的 digest 由 GitHub 在上传后异步计算，刚上传完可能还是 null ——
          # 一次性查询把它当失败会误杀（2026-09-17 实测：两次都死在这里，且失败信息
          # 与「asset 真的不存在」完全一样，无法区分）。所以轮询重试。
          #
          # ⚠️ 但必须把「HTTP 404（Release 不存在）」与「200 但 digest 还是 null（还没算完）」
          #    分开报 —— 2026-09-17 实测踩过：Release 压根没建出来，这里却报「GitHub 可能
          #    还没算完」，把人引去查 digest 延迟，白查一轮。所以下面把状态码单独取出来。
          REMOTE_SUM=""
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sSL -o "$RUNNER_TEMP/rel.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            if [ "$CODE" = "404" ]; then
              echo "::error::Release $TAG 不存在（HTTP 404）—— 上一步的创建没有生效，不是 digest 延迟。响应：$(head -c 300 "$RUNNER_TEMP/rel.json")"
              exit 1
            fi
            if [ "$CODE" != "200" ]; then
              echo "第 $i 次查询异常（HTTP $CODE），10 秒后重试…"
              sleep 10
              continue
            fi
            REMOTE_SUM=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); apk=[a for a in (d.get("assets") or []) if a["name"].lower().endswith(".apk")]; print((apk[0].get("digest") or "").removeprefix("sha256:") if apk else "")' "$RUNNER_TEMP/rel.json")
            if [ -n "$REMOTE_SUM" ]; then break; fi
            echo "第 $i 次查询还没有 digest（Release 在、asset=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print([a["name"] for a in (d.get("assets") or [])])' "$RUNNER_TEMP/rel.json")），10 秒后重试…"
            sleep 10
          done
          echo "Release asset 的 SHA-256：$REMOTE_SUM"
          if [ -z "$REMOTE_SUM" ]; then
            echo "::error::取不到 Release asset 的摘要（已重试 6 次，Release 存在但 digest 一直为空）：asset 可能真的没上传，或 GitHub 迟迟未算出。"
            exit 1
          fi
          if [ "$REMOTE_SUM" != "$LOCAL_SUM" ]; then
            echo "::error::Release asset 的 SHA-256 与本地构建产物不一致，应用内更新会因此拒绝安装"
            exit 1
          fi
          echo "摘要一致。"

      # 机器字段（版本号 / apkUrl / sha256）由 CI 写回，人工不碰 —— 否则会出现
      # 「Release 已经是新的、version.json 还是旧的」这种最难查的脱节。
      # changelog 是 version.json 里唯一手写的字段，本步骤不动它。
      #
      # 用 GITHUB_TOKEN 推送的提交不会再触发 workflow（GitHub 的设计），所以不会自我循环。
      # 推送目标写 HEAD:master：本步骤基于 tag 指向的提交，所以要求发版人先把 master 推上去
      # （release.sh 的提示里就是这个顺序），否则这里会因非快进被拒。
      - name: 把版本信息写回 docs/version.json
        # 预发布直接跳过：Manifest 是所有客户端（含已发布的正式版）唯一的更新源，
        # 写进去等于把 beta 推给全部用户。beta 只存在于 Releases 里。
        if: steps.channel.outputs.prerelease != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          APK_SUM: ${{ steps.apk.outputs.sum }}
        run: |
          python3 scripts/sync_version.py --sha256 "$APK_SUM"
          python3 scripts/sync_version.py --check

          if git diff --quiet -- docs/version.json; then
            echo "docs/version.json 已经是最新，无需提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git commit -m "release: 同步 version.json 到 $TAG"

          # 构建这几分钟里 master 可能又被推了提交（发版后补文档是常规操作）。直接 push 会因
          # 非快进被拒 —— 后果是 Release 已经建好、Manifest 却没更新，所有客户端永远收不到这个
          # 版本，而且不报任何错。所以先 rebase 到远端 master 再推（实测过：不加这两行会被拒）。
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
