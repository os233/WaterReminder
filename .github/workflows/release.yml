name: Release

# 打 tag 即发版：构建签名 release APK，创建 GitHub Release 并把 APK 作为 asset 上传，
# 正式 tag 还会把版本信息写回 docs/version.json 并推 master（预发布 tag 不写，见下）。
#
# 分发链路（谁是权威、谁读谁）：
#   GitHub Release     发布平台 —— APK asset、tag、Release Notes（给人看）
#   docs/version.json  发布 Manifest —— App 内更新与官网都读它，机器字段由本工作流写回
#   GitHub Pages       托管 version.json 与官网静态文件
# APK 只以 Release asset 分发，不进仓库、也不放 GitHub Pages。
#
# ⚠️ 顺序：写回 version.json 必须发生在 asset 上传**之后**。反过来的话 Manifest 会指向
#    一个还不存在的下载地址，老客户端点更新直接 404。这也是机器字段只能由 CI 写、
#    不能本地提前改的原因。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   KEYSTORE_BASE64  密钥库文件的 base64（`base64 -w0 water_keystore.jks`）
#   STORE_PASSWORD   库口令
#   KEY_ALIAS        别名（key0）
#   KEY_PASSWORD     密钥口令
# 注意：口令里若有 `=` 或 `\`，写进 keystore.properties 需要转义，建议先换成简单字符。
#
# 用法（先在 Settings → Secrets 配好签名信息）：
#   打 tag 即发版：git push origin v<版本号>（tag 指向 versionName 一致的提交）
#   预发布同理：  git push origin v<版本号>-<后缀>（如 v0.0.1-beta.1）
#   手动触发保留：Actions → Release → Run workflow 填 tag，用于失败重跑（会覆盖已有 asset）
#
# 触发范围：正式 tag（如 `v0.0.2`）与预发布 tag（如 `v0.0.1-beta.1`）都会发版。
# 两者的差别只有两处 —— Release 的 prerelease 标记，以及是否写回 docs/version.json：
#
#   正式 tag   → 建普通 Release → 写回 Manifest → 所有客户端收到这一版
#   预发布 tag → 建 prerelease  → **不动 Manifest** → 只有主动下载的人拿得到
#
# ⚠️ 预发布绝不能写回 Manifest：Manifest 是所有客户端（含已发布的正式版）唯一的更新源，
#    写进去等于把 beta 推给全部用户。官网首页 / 下载页读 /releases/latest，该端点天然排除
#    prerelease，所以 beta 不会出现在下载页；更新日志页读 /releases 列表，会带「预发布」标签。
#
# ⚠️ glob 语义：`[0-9]*` 是「一个数字 + 任意串」—— `*` 是通配符，不是量词。所以第一条其实
#    **已经**会匹配 `v0.0.1-beta.1`（末尾的 `*` 吃掉了 `-beta.1`）。第二条只是把这个意图
#    显式写出来，免得将来被当成冗余删掉。原来那条 `!v*-*` 排除项已删除 —— 它正是以前
#    「推 beta tag 什么都不发生」的原因。

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 先校验版本号一致性，避免白跑几分钟构建
      - name: 校验 tag 与 versionName 一致
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/sync_version.py --expect-tag "$TAG"

      # 预发布判定：tag 带 `-` 后缀（`v0.0.1-beta.1`）即为预发布。
      # 下游用它决定 Release 是否标 prerelease、以及是否跳过 Manifest 写回。
      - name: 判定发布通道
        id: channel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            *-*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "预发布通道：$TAG"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "正式通道：$TAG"
              ;;
          esac

      # README 已说明：Gradle 8.11.1 只支持到 Java 23，固定用 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（compileSdk 36）
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 还原签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，请在仓库 Settings → Secrets 里配置签名信息"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: 构建 release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物：$APK"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: 校验版本号一致性
        run: python3 scripts/sync_version.py --check

      # 应用内更新会拿这个摘要校验下载到的安装包，先记下本地产物自己的值
      - name: 计算 APK 的 SHA-256
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "本地构建产物 SHA-256：$SUM"
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          # 刻意不用 `[ ... ] && FLAG=--prerelease`：run 是 `bash -e`，条件为假时
          # 整行返回 1，会让脚本在这里直接退出。
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖 asset"
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
            # 重跑时补标记：手建过的 Release 可能没标 prerelease —— 那样它就成了
            # /releases/latest 的候选，会把 beta 顶到官网下载页上。
            if [ -n "$PRERELEASE_FLAG" ]; then
              gh release edit "$TAG" --prerelease
            fi
          else
            # Release 说明直接取 docs/version.json 的 changelog —— 那是更新说明唯一手写的地方，
            # 官网更新日志页读的就是这个 body。用 --generate-notes 的话页面上只剩
            # 「Full Changelog: <链接>」，对用户没有信息量。
            NOTES=$(python3 -c "import json;print(json.load(open('docs/version.json',encoding='utf-8')).get('changelog') or '')")
            if [ -z "$NOTES" ]; then
              echo "::warning::docs/version.json 的 changelog 是空的，Release 说明与官网更新日志会没有内容"
              NOTES="（本次发版没有填写更新说明）"
            fi
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --title "$TAG" --notes "$NOTES" $PRERELEASE_FLAG
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # 应用内更新按这个摘要判断安装包是否完整，所以这里必须核对上传后的值
      - name: 核对 Release asset 的 SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          LOCAL_SUM: ${{ steps.apk.outputs.sum }}
        run: |
          REMOTE_SUM=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | python3 -c 'import json,sys; assets = json.load(sys.stdin).get("assets") or []; apk = [a for a in assets if a["name"].lower().endswith(".apk")]; print((apk[0].get("digest") or "").removeprefix("sha256:") if apk else "")')
          echo "Release asset 的 SHA-256：$REMOTE_SUM"
          if [ -z "$REMOTE_SUM" ]; then
            echo "::error::取不到 Release asset 的摘要，GitHub 可能还没算完"
            exit 1
          fi
          if [ "$REMOTE_SUM" != "$LOCAL_SUM" ]; then
            echo "::error::Release asset 的 SHA-256 与本地构建产物不一致，应用内更新会因此拒绝安装"
            exit 1
          fi
          echo "摘要一致。"

      # 机器字段（版本号 / apkUrl / sha256）由 CI 写回，人工不碰 —— 否则会出现
      # 「Release 已经是新的、version.json 还是旧的」这种最难查的脱节。
      # changelog 是 version.json 里唯一手写的字段，本步骤不动它。
      #
      # 用 GITHUB_TOKEN 推送的提交不会再触发 workflow（GitHub 的设计），所以不会自我循环。
      # 推送目标写 HEAD:master：本步骤基于 tag 指向的提交，所以要求发版人先把 master 推上去
      # （release.sh 的提示里就是这个顺序），否则这里会因非快进被拒。
      - name: 把版本信息写回 docs/version.json
        # 预发布直接跳过：Manifest 是所有客户端（含已发布的正式版）唯一的更新源，
        # 写进去等于把 beta 推给全部用户。beta 只存在于 Releases 里。
        if: steps.channel.outputs.prerelease != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          APK_SUM: ${{ steps.apk.outputs.sum }}
        run: |
          python3 scripts/sync_version.py --sha256 "$APK_SUM"
          python3 scripts/sync_version.py --check

          if git diff --quiet -- docs/version.json; then
            echo "docs/version.json 已经是最新，无需提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git commit -m "release: 同步 version.json 到 $TAG"

          # 构建这几分钟里 master 可能又被推了提交（发版后补文档是常规操作）。直接 push 会因
          # 非快进被拒 —— 后果是 Release 已经建好、Manifest 却没更新，所有客户端永远收不到这个
          # 版本，而且不报任何错。所以先 rebase 到远端 master 再推（实测过：不加这两行会被拒）。
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
